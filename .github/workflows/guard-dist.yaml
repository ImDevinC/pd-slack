name: Guard dist directory

on:
  pull_request:
    types: [labeled, unlabeled, opened, edited, synchronize, ready_for_review]

jobs:
  check-dist:
    name: No dist/ changes in PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if the PR touches dist/
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "${base}" HEAD | grep -q '^dist/'; then
            echo "::error::Files under dist/ must not be committed through a PR. The dist/ directory is managed exclusively by CI on release."
            exit 1
          fi
          echo "OK: this PR does not change any files under dist/."