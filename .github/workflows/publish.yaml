name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  publish-docker:
    permissions:
      packages: write
      contents: read
    uses: imdevinc/imdevinc/.github/workflows/shared-publish-docker.yaml@v1
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Get the tag
        id: get_tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Prepare Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.5
      - name: Build release binaries
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o out/pd-slack -ldflags "-s -w" ./cmd/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o out/pd-slack-arm64 -ldflags "-s -w" ./cmd/main.go
          tar -czf out/pd-slack.tar.gz -C out pd-slack
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          draft: false
          name: ${{ steps.get_tag.outputs.TAG }}
          tag: ${{ steps.get_tag.outputs.TAG }}
          token: ${{ github.token }}
          artifacts: out/pd-slack,out/pd-slack-arm64,out/pd-slack.tar.gz
