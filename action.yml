name: 'PD Slack Sync'
description: 'Sync PagerDuty on-call users to a Slack user group.'
author: 'ImDevinC'

branding:
  icon: 'users'
  color: 'purple'

inputs:
  slack-bot-token:
    description: >-
      Slack Bot User OAuth token. Requires the usergroups:read and
      usergroups:write scopes. Prefer passing this via a secret.
    required: true
  pagerduty-api-token:
    description: >-
      PagerDuty API token. Prefer passing this via a secret.
    required: true
  config-file:
    description: >-
      Path to a YAML config file for syncing multiple groups. When set, this
      takes precedence over the single-group inputs below. Paths are resolved
      relative to the checkout directory.
    required: false
    default: ''
  slack-group-name:
    description: >-
      Name of the Slack user group to sync. Ignored when config-file is set.
    required: false
    default: ''
  slack-group-description:
    description: >-
      Description for the Slack user group when it needs to be created. Ignored
      when config-file is set.
    required: false
    default: ''
  pagerduty-schedule-ids:
    description: >-
      Comma-separated list of PagerDuty schedule IDs whose on-call users are
      synced to the group. Ignored when config-file is set.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Download precompiled binary
      shell: bash
      run: |
        set -euo pipefail

        repo="${{ github.action_repository }}"
        case "${{ runner.arch }}" in
          ARM64|arm64)
            asset="pd-slack-arm64"
            ;;
          *)
            asset="pd-slack"
            ;;
        esac

        version="${{ github.action_ref }}"
        version="${version#refs/tags/}"

        base_url="https://github.com/${repo}/releases"
        binary="${RUNNER_TEMP}/pd-slack"

        # Prefer the exact release matching the ref. Float tags (e.g. v0),
        # branches, and commit SHAs do not have their own release, so fall
        # back to the latest release for those.
        if [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && curl -fsSL "${base_url}/download/${version}/${asset}" -o "${binary}" 2>/dev/null; then
          echo "Downloaded pd-slack ${asset} from release ${version}"
        else
          curl -fsSL "${base_url}/latest/download/${asset}" -o "${binary}"
          echo "Downloaded pd-slack ${asset} from the latest release (ref: ${version})"
        fi

        chmod +x "${binary}"
        echo "pd-slack-binary=${binary}" >> "${GITHUB_ENV}"
    - name: Run pd-slack
      shell: bash
      run: "${PD_SLACK_BINARY}"
